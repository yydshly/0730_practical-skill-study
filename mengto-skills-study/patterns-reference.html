<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设计模式速查手册 — Agent Skills 模式库</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a25;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --muted: #8888a0;
      --accent: #7c6fff;
      --accent2: #ff6f9c;
      --tag-bg: #1e1e2e;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; }
    nav { display: flex; gap: 2rem; padding: 1.2rem 2rem; border-bottom: 1px solid var(--border); align-items: center; }
    nav .logo { font-weight: 700; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
    nav a:hover, nav a.active { color: var(--text); }
    .page-header { text-align: center; padding: 3rem 1rem 2rem; }
    .page-header h1 { font-size: 1.8rem; font-weight: 700; margin: 0 0 0.5rem; background: linear-gradient(135deg, #7c6fff, #ff6f9c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .page-header p { color: var(--muted); margin: 0; font-size: 0.95rem; }
    .page-header .badge-row { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
    .badge { background: var(--tag-bg); border: 1px solid var(--border); padding: 0.25rem 0.75rem; border-radius: 2rem; font-size: 0.78rem; color: var(--muted); }

    .filters { display: flex; gap: 0.5rem; justify-content: center; padding: 0 1rem 2rem; flex-wrap: wrap; }
    .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding: 0 2rem 3rem; max-width: 1400px; margin: 0 auto; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.2s; }
    .card:hover::before { opacity: 1; }
    .card-type { font-size: 0.7rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    .card-name { font-size: 1rem; font-weight: 700; margin: 0 0 0.4rem; }
    .card-from { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.6rem; }
    .card-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; gap: 0.4rem; margin-top: 0.8rem; flex-wrap: wrap; }
    .card-tag { background: var(--tag-bg); border: 1px solid var(--border); padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; color: var(--muted); }

    /* Detail Overlay */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .overlay.open { display: flex; }
    .detail { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; position: relative; }
    .detail-header { padding: 1.5rem 1.5rem 0; }
    .detail-type { font-size: 0.7rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    .detail-name { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.3rem; }
    .detail-from { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }
    .detail-close { position: absolute; top: 1.25rem; right: 1.25rem; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .detail-close:hover { background: var(--border); color: var(--text); }
    .detail-body { padding: 0 1.5rem 1.5rem; }
    .detail-section { margin-bottom: 1.25rem; }
    .detail-section h3 { font-size: 0.8rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 0.6rem; }
    .detail-section p { color: var(--text); font-size: 0.88rem; line-height: 1.7; margin: 0; }
    .detail-section pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-size: 0.8rem; line-height: 1.6; overflow-x: auto; margin: 0; color: #c0c0d8; white-space: pre-wrap; }
    .detail-section ul { margin: 0; padding-left: 1.2rem; }
    .detail-section li { color: var(--text); font-size: 0.88rem; line-height: 1.7; margin-bottom: 0.3rem; }
    .detail-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .detail-copy-btn { background: var(--accent); border: none; color: #fff; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; transition: opacity 0.2s; }
    .detail-copy-btn:hover { opacity: 0.85; }
    .detail-divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  </style>
</head>

  <div class="page-header">

    <div class="badge-row">

    <button class="filter-btn" data-filter="prompt">Prompt 模式</button>
    <button class="filter-btn" data-filter="workflow">工作流模式</button>

  <div class="card-grid" id="cardGrid"></div>

  <div class="overlay" id="overlay">
    <div class="detail" id="detailPanel">
      <div class="detail-header">
        <button class="detail-close" id="detailClose">×</button>
        <div class="detail-type" id="detailType"></div>
        <div class="detail-name" id="detailName"></div>
        <div class="detail-from" id="detailFrom"></div>
        <div class="detail-meta" id="detailMeta"></div>
      </div>
      <div class="detail-body">
        <div class="detail-section">
          <h3>一句话定义</h3>
          <p id="detailOneLiner"></p>
        </div>
        <div class="detail-section">

          <p id="detailDesc"></p>
        </div>
        <hr class="detail-divider">

          <h3>代码 / 模板</h3>
          <pre id="detailCode"></pre>
        </div>
        <hr class="detail-divider">
        <div class="detail-section">
          <h3>何时使用</h3>
          <ul id="detailWhen"></ul>

        <button class="detail-copy-btn" id="copyBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制代码模板
        </button>
      </div>

<script>
const DETAIL_DATA = {
  "markup-api": {
    name: "数据属性标记 API",
    type: "arch",
    typeLabel: "架构模式",
    from: "cinematic-gsap-lenis-motion-system",
    tags: ["CSS", "GSAP", "可复用系统"],
    oneLiner: "用 data-* 属性声明式地描述行为，JS 通过属性选择器驱动，无需修改业务代码。",
    desc: "将交互行为绑定在 HTML 标签的 data 属性上，而不是散落在 JS 选择器里。同一套 CSS/JS 系统可以在多个页面复用，只要 markup 遵循约定。常见于动画系统、滚动驱动、特效层。属性既是配置也是文档。",
    code: `<!-- HTML: 声明式标记，JS 自动驱动 -->
<h1 data-motion-text="lines">Cinematic motion.</h1>
<section data-reveal-group>
  <article data-reveal="fade-up" data-reveal-item>Card 1</article>
  <article data-reveal="fade-up" data-reveal-item>Card 2</article>
</section>
<figure data-image-reveal data-parallax-section>
  <img data-parallax-image src="/studio.jpg" alt="">
</figure>

// JS: 属性驱动，无选择器耦合
function initScrollReveals() {
  gsap.utils.toArray("[data-reveal-group]").forEach(group => {
    const items = group.querySelectorAll("[data-reveal-item]");
    gsap.fromTo(items,
      { y: 36, autoAlpha: 0 },
      { y: 0, autoAlpha: 1, stagger: 0.075,
        scrollTrigger: { trigger: group, start: "top 82%", once: true } }
    );
  });
}`,
    when: [
      "需要跨页面复用一个行为系统（动画、滚动、特效）",
      "设计师/内容编辑可以通过改 HTML 属性来控制行为",
      "团队成员无需读 JS 就能知道某个元素会有什么效果"
    ]
  },

  "five-constraint": {
    name: "5个约束强制精选",
    type: "quality",
    typeLabel: "质量保障",
    from: "daily-ui-inspiration-capture",
    tags: ["约束", "精选", "防熵增"],
    oneLiner: "用数量上限强制精选，防止积累污染，防止决策疲劳。",
    desc: "当没有上限时，内容会不断积累、重复、质量下降。设定精确的数量上限（如恰好 5 个）迫使执行者在早期就做出取舍，而不是最后随意删减。配合去重检查（比对历史记录），可以长期维持高质量收藏。",
    code: `## 约束模板（直接 copy 使用）
Collect exactly 5 final references.

Selection criteria:
- 清晰的 first viewport
- 可检查的区块结构
- 强字体/排版
- 产品或品牌特性
- 可见的运动潜力

Reject candidates that repeat a normalized title,
source URL, or image URL from previous captures.`,
    when: [
      "需要定期产出高质量参考集合（如每日 UI 灵感）",
      "防止收集变成囤积，参考库越来越臃肿",
      "需要强制早期决策而非最后随机删减"
    ]
  },

  "execute-verify-loop": {
    name: "执行-验证循环",
    type: "workflow",
    typeLabel: "工作流模式",
    from: "iterate-until-verified",
    tags: ["循环", "验证", "质量门"],
    oneLiner: "产出 → 验证 → 失败路由 → 修订 → 再验证，直到所有质量门通过。",
    desc: "不追求一次做对，而是把验证作为循环的核心驱动力。每次迭代都运行applicable gates，记录 pass/fail/ blocked，有证据地路由失败项到负责的工作流，修订后重新验证。只在 required gates 全部通过时结束。",
    code: `## Execute-Verify Loop 骨架
Repeat:
  1. Produce or improve the candidate
  2. Run every applicable gate
  3. Record pass / fail / blocked with evidence
  4. Route each failure to the responsible workstream
  5. Make the smallest revision addressing the evidence
  6. Re-run the failed gate + affected regression gates
  7. Integrate only verified work

Continue while required gates fail AND
a safe, in-scope action can make meaningful progress.`,
    when: [
      "任务规模大，需要分多个独立 worker 并行处理",
      "质量标准不明确，需要把「完美」「专业」翻译成可观测的检查项",
      "需要防止 implementer 同时扮演自己的审核者"
    ]
  },

  "quality-gate-matrix": {
    name: "质量门矩阵",
    type: "quality",
    typeLabel: "质量保障",
    from: "iterate-until-verified",
    tags: ["质量门", "接受标准", "矩阵"],
    oneLiner: "把「完美」「专业」「production-ready」翻译成带验证方法和通过条件的 Observable 矩阵。",
    desc: "用表格形式定义每个 gate：质量维度、验证方法、通过条件、证据来源。优先用 pass/fail 条件而非模糊分数。强主观反应（如「哇」）可以是信号，但不能是唯一的 gate。",
    code: `## 质量门矩阵模板
| Gate | Verification method | Pass condition | Evidence |
|------|-------------------|---------------|----------|
| 正确性 | 单元测试 + 类型检查 | 0 errors | npm test |
| 完整性 | 需求逐条核对 | 每条有对应实现 | 代码审查 |
| 性能 | Lighthouse CI | Score ≥ 90 | lighthouse report |
| 可访问性 | axe-core | 0 violations | axe output |

Translate: "perfect" → specific observable checks
           "best"    → benchmark comparison
           "AAA"     → defined acceptance criteria`,
    when: [
      "用户使用模糊质量词（完美、最好、专业）",
      "需要明确「什么时候算完成」",
      "需要让审核者有据可查，而不是凭感觉通过"
    ]
  },

  "portable-contract": {
    name: "Portable Contract",
    type: "workflow",
    typeLabel: "工作流模式",
    from: "article-prompts-to-skills",
    tags: ["抽象化", "可迁移", "资产保护"],
    oneLiner: "保留成功机制，移除来源特定包装，生产可迁移到其他主题/布局/视觉系统的能力包。",
    desc: "提取时区分「成功机制」和「来源包装」。保留行为与状态转换、数据模型与参数默认值、timing/easing/spacing 规则、可访问性行为、性能约束与失败模式、接受检查。移除品牌名称、营销文案、硬编码 palette/asset/selector、偶然的实现选择。",
    code: `## Portable Contract 提取检查清单
✅ Keep (transferable mechanics):
  - behavior + state transitions
  - data model + parameter defaults
  - timing, easing, spacing, responsive rules
  - accessibility + reduced-motion + keyboard behavior
  - performance constraints + failure modes
  - acceptance checks proving the result

❌ Remove (source-specific packaging):
  - brand names, marketing copy, proprietary content
  - page layout unrelated to the capability
  - hard-coded palettes, assets, selectors
  - incidental implementation choices
    not affecting the outcome`,
    when: [
      "需要从某篇文章/教程提取可复用的 Skill",
      "防止技能被锁定在特定品牌/主题/技术栈里",
      "需要把概念性能力转化为可操作的工具包"
    ]
  },

  "similarity-dial": {
    name: "相似度刻度盘",
    type: "prompt",
    typeLabel: "Prompt 模式",
    from: "generate-reference-inspired-brand-worlds",
    tags: ["相似度", "版权安全", "品牌设计"],
    oneLiner: "用百分比刻度盘（30%–85%）控制新作品与参考的相似度，平衡原创性与灵感关系。",
    desc: "为每次创作设定明确的相似度目标：30% 只保留抽象原则（情绪、密度、对比）；70% 保持参考的构图逻辑、质感、色彩关系、人情味、字标比例，同时创造全新主体；85% 保留高层视觉语法但改变至少四个签名元素。默认 70%。用户说「inspired not copying」时，即使请求 70–85% 也优先保护原创性。",
    code: `## 相似度刻度盘使用模板
Similarity dials:
  30% — distant inspiration
         Keep: mood, density, contrast (abstract only)
         Change: palette, composition, subjects, type
  50% — recognizable influence
         Share: medium + emotional tone
         Change: palette, composition, subjects, type system
  70% — adjacent brand family (DEFAULT)
         Share: composition logic, texture, palette relationships,
                human presence, wordmark scale
         Change: subjects, actions, arrangement, letterforms
  85% — close art-direction neighbor
         Share: most high-level visual grammar
         Change: ≥4 signature elements
         Do NOT: recreate exact commercial identity`,
    when: [
      "用户提供参考图，要求生成「相似但不同的」作品",
      "需要防止无意中的版权/商标侵权",
      "品牌设计、风格迁移、campaign 图像生成"
    ]
  },

  "vertical-slice": {
    name: "垂直切片",
    type: "arch",
    typeLabel: "架构模式",
    from: "build-isometric-arpg",
    tags: ["MVP", "增量交付", "游戏开发"],
    oneLiner: "按「最小组件可玩」切分项目，每次交付一个完整的端到端功能环，而非半成品系统。",
    desc: "先交付 title/menu/movement/one encounter/reward/progression/continuation 的完整循环，再添加第二个系统。每个 slice 交付时有 gameplay proof、自动化覆盖、稳定 save/load 路径。在前一个 slice 有可玩证明和稳定路径之前，不添加第二个系统。",
    code: `## 垂直切片顺序（游戏开发参考）
Slice 1: Movement + camera + collision + target selection + pause/restart
Slice 2: One combat verb + contact + damage + posture + recovery + death
Slice 3: One enemy with telegraph + decision loop + counterplay
Slice 4: One reward + atomic inventory/progression update
Slice 5: One zone transition or objective completion

Rules:
- Each slice: playable route + deterministic test state
- No slice 2 until slice 1 has gameplay proof
- No slice 3 until slice 2 has stable save/load path`,
    when: [
      "游戏、大型应用或任何需要多系统协作的项目",
      "需要在早期就有可演示的成果而非中间半成品",
      "防止多个系统并行开发时集成交付的风险"
    ]
  },

  "atomic-transaction": {
    name: "原子事务",
    type: "arch",
    typeLabel: "架构模式",
    from: "build-game-inventory",
    tags: ["原子性", "数据一致性", "游戏开发"],
    oneLiner: "所有状态变更走 验证→计算→提交或拒绝→持久化，从不移除前不确认目的地合法。",
    desc: "对于物品拾取、装备切换、背包整理等操作：先验证源所有权和目的地合法性，再计算完整下一步状态，最后要么一起提交要么一起拒绝。绝不先移除再等目的地确认——防止双花和状态不一致。保持 item identity 跨 swap，item 唯一来源。",
    code: `## 原子事务模板（以物品转移为例）
function transferItem(itemId, fromSlot, toSlot) {
  // 1. Validate
  if (!validateOwnership(itemId, fromSlot)) return Error('Not owner');
  if (!validateDestination(itemId, toSlot))  return Error('Invalid destination');

  // 2. Compute next state
  const nextState = computeNextInventoryState(itemId, fromSlot, toSlot);

  // 3. Commit or Reject (atomic)
  if (!isValidState(nextState)) return Error('Invalid state');
  commitState(nextState);

  // 4. Persist after committed
  persistInventory(nextState);
}

// Never: removeItem(itemId) → then tryAddToSlot(toSlot)
// Always: validate → compute → commit-or-reject → persist`,
    when: [
      "物品/装备/资源系统中的双向转移（拾取、穿戴、交换、出售）",
      "需要防止网络延迟或异常中断导致的状态不一致",
      "游戏 inventory、loot 系统、装备系统"
    ]
  },

  "decision-tree": {
    name: "决策树路由",
    type: "workflow",
    typeLabel: "工作流模式",
    from: "performance-profiling",
    tags: ["路由", "决策树", "诊断"],
    oneLiner: "用 if/then 决策树把问题路由到正确的专业路径，避免一套通用方案处理所有问题。",
    desc: "在开始工作前，先问一个决策问题把任务分流到专门的子路径。每个子路径有自己的 reference 文件、工具选择、验证方法。避免「万能流程」导致的过度检查或遗漏关键诊断点。",
    code: `## 决策树模板
What problem are you investigating?

+ App hangs, stutters, dropped frames, high CPU
  → Read references/time-profiler.md
  → Use: Time Profiler + Hangs instrument

  vague skill.
  → Signal: skill name is a category, not an outcome.
  → Fix: split by independent reusable behavior.

- **Micro-fragments**: turning every sentence into a skill
  without reusable behavior.

// ── Render ────────────────────────────────────────────────────────────────
const grid = document.getElementById('cardGrid');

function renderCards(filter = 'all') {
  grid.innerHTML = '';
  Object.entries(DETAIL_DATA).forEach(([key, data]) => {
    if (filter !== 'all' && data.type !== filter) return;
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.key = key;
    card.innerHTML = `
      <div class="card-type">${data.typeLabel}</div>
      <div class="card-name">${data.name}</div>
      <div class="card-from">来源: ${data.from}</div>
      <p class="card-desc">${data.oneLiner}</p>
      <div class="card-footer">
        ${data.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
      </div>`;
    card.addEventListener('click', () => openDetail(key));
    grid.appendChild(card);
  });
}

function openDetail(key) {
  const data = DETAIL_DATA[key];
  document.getElementById('detailType').textContent = data.typeLabel;
  document.getElementById('detailName').textContent = data.name;
  document.getElementById('detailFrom').textContent = '来源: ' + data.from;
  document.getElementById('detailOneLiner').textContent = data.oneLiner;
  document.getElementById('detailDesc').textContent = data.desc;
  document.getElementById('detailCode').textContent = data.code;
  document.getElementById('detailMeta').innerHTML = data.tags.map(t => `<span class="card-tag">${t}</span>`).join('');
  document.getElementById('detailWhen').innerHTML = data.when.map(w => `<li>${w}</li>`).join('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('copyBtn').dataset.code = data.code;
}

document.getElementById('detailClose').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
});
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('overlay')) document.getElementById('overlay').classList.remove('open');
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('overlay').classList.remove('open'); });

document.getElementById('copyBtn').addEventListener('click', function () {
  const code = this.dataset.code;
  navigator.clipboard.writeText(code).then(() => {
    const orig = this.innerHTML;
    this.innerHTML = '✓ 已复制';
    setTimeout(() => { this.innerHTML = orig; }, 1500);
  });
});

document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards(btn.dataset.filter);
});

renderCards();
</script>
