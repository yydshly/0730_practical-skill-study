<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>画轴画廊 · 人像风格巡展</title>
  <meta name="description" content="20 种人像风格 · 悬挂式交互画廊 · 可拖拽浏览" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       DESIGN SYSTEM — 墨色金中式典雅主题
    ============================================================ */
    :root {
      --ink: #1a1612;
      --ink-2: #3d3530;
      --muted: #7a6f65;
      --muted-2: #a09488;
      --gold: #c4963a;
      --gold-deep: #9a7430;
      --gold-text: #b8892e;
      --paper: #faf6f0;
      --hairline: rgba(26, 22, 18, 0.08);

      --fs-nav: clamp(13px, 1.25vw, 15.5px);
      --fs-badge: clamp(12px, 1.13vw, 13.5px);
      --fs-h1: clamp(36px, 6.5vw, 80px);
      --fs-sub: clamp(14px, 1.4vw, 18px);
      --fs-cta: clamp(14px, 1.35vw, 17px);

      --pad-x: clamp(18px, 3.3vw, 44px);
      --nav-y: clamp(18px, 2.2vw, 30px);

      --r-pill: 999px;

      --sh-badge: 0 1px 3px rgba(26,22,18,0.06), 0 6px 16px rgba(26,22,18,0.08);
      --sh-btn-sm: 0 4px 14px rgba(196,150,58,0.25), 0 1px 0 rgba(255,255,255,0.3) inset;
      --sh-btn-lg: 0 10px 28px rgba(196,150,58,0.3), 0 2px 6px rgba(196,150,58,0.18), 0 1px 0 rgba(255,255,255,0.4) inset;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      font-family: "Noto Sans SC", ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background-color: #f5f0e8;
      background-image:
        radial-gradient(55% 45% at 8% 105%, rgba(196,150,58,0.12) 0%, rgba(196,150,58,0) 70%),
        radial-gradient(50% 42% at 92% 104%, rgba(154,116,48,0.14) 0%, rgba(154,116,48,0) 70%),
        radial-gradient(44% 36% at 65% 97%, rgba(196,150,58,0.08) 0%, rgba(196,150,58,0) 72%),
        radial-gradient(62% 50% at 50% -5%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 62%);
      background-attachment: fixed;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: absolute;
      top: calc(-1 * var(--rope-overhang));
      right: 0; left: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: calc(100% + var(--rope-overhang));
      pointer-events: none;
    }
    .page {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }
    .page a, .page button, .page .interactive { pointer-events: auto; }

    /* navigation */
    .nav {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--nav-y) var(--pad-x);
    }
    .logo {
      font-family: "Noto Serif SC", "Noto Serif", serif;
      font-size: clamp(18px, 1.9vw, 24px);
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1;
      color: var(--ink);
      text-decoration: none;
    }
    .logo .mark { color: var(--gold); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.6vw, 34px);
    }
    .nav-links a {
      font-size: var(--fs-nav);
      font-weight: 400;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: color 0.18s ease;
    }
    .nav-links a:hover { color: var(--ink); }

    .nav-center {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: clamp(14px, 2vw, 26px);
    }
    .link-login {
      font-size: var(--fs-nav);
      color: var(--muted);
      text-decoration: none;
    }
    .link-login:hover { color: var(--ink); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      border-radius: var(--r-pill);
      color: #fff;
      background: linear-gradient(180deg, #d4a84b 0%, var(--gold) 55%, var(--gold-deep) 100%);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease, filter 0.18s ease;
    }
    .btn:hover { transform: translateY(-1px); filter: saturate(1.08); }
    .btn:active { transform: translateY(0); }
    .btn-sm {
      font-size: var(--fs-nav);
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 0 clamp(18px, 2.1vw, 26px);
      height: clamp(36px, 3.4vw, 42px);
      box-shadow: var(--sh-btn-sm);
    }
    .btn-lg {
      font-size: var(--fs-cta);
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0 clamp(22px, 2.7vw, 34px);
      height: clamp(42px, 4vw, 50px);
      box-shadow: var(--sh-btn-lg);
    }

    /* hero */
    .hero {
      padding: clamp(16px, 2.2vw, 28px) var(--pad-x) 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--paper);
      border: 1px solid var(--hairline);
      box-shadow: var(--sh-badge);
      border-radius: var(--r-pill);
      padding: clamp(6px, 0.7vw, 8px) clamp(12px, 1.4vw, 18px);
      font-size: var(--fs-badge);
      font-weight: 400;
      color: var(--ink-2);
      letter-spacing: 0.04em;
    }

    h1 {
      margin: clamp(12px, 1.8vw, 22px) 0 0;
      font-family: "Noto Serif SC", "Noto Serif", serif;
      font-weight: 700;
      font-size: var(--fs-h1);
      line-height: 1.05;
      letter-spacing: 0.02em;
      color: var(--ink);
      max-width: none;
    }
    h1 .hl { color: var(--gold-text); }

    .sub {
      margin: clamp(10px, 1.4vw, 18px) 0 0;
      font-size: var(--fs-sub);
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .style-count {
      margin-top: clamp(6px, 1vw, 12px);
      font-size: clamp(12px, 1.2vw, 14px);
      color: var(--gold);
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    /* rope zone */
    #ropeZone {
      --rope-overhang: clamp(56px, 7vw, 104px);
      --rope-min-height: clamp(280px, 32vw, 370px);
      position: relative;
      isolation: isolate;
      flex: 1 1 auto;
      min-height: var(--rope-min-height);
      margin-top: clamp(14px, 1.8vw, 24px);
    }
    #ropeHit {
      position: absolute;
      left: 0; right: 0;
      top: calc(-1 * var(--rope-overhang));
      bottom: 0;
      z-index: 2;
      pointer-events: auto;
      touch-action: pan-y;
      cursor: grab;
      outline: none;
    }
    #ropeHit.dragging { cursor: grabbing; }
    #ropeHit:focus-visible {
      box-shadow: inset 0 0 0 2px rgba(196,150,58,0.6);
      border-radius: 14px;
    }

    /* style index bar */
    .style-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1vw, 12px);
      padding: 0 var(--pad-x) clamp(18px, 3vw, 36px);
      opacity: 0.55;
      flex-wrap: wrap;
    }
    .style-dot {
      width: clamp(6px, 0.7vw, 9px);
      height: clamp(6px, 0.7vw, 9px);
      border-radius: 50%;
      background: var(--gold);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .style-dot.active {
      transform: scale(1.5);
      opacity: 1;
    }

    /* utility */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    #fps {
      position: fixed;
      z-index: 9;
      left: 10px; bottom: 10px;
      font: 500 11px/1.3 ui-monospace, monospace;
      color: #4a4a4a;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 5px 8px;
      display: none;
      pointer-events: none;
    }
    .hint {
      position: absolute;
      left: 50%; bottom: 6px;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--muted-2);
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      z-index: 3;
    }
    .hint.show { opacity: 1; }

    /* responsive */
    @media (max-width: 900px) {
      .nav-center { display: none; }
    }
    @media (max-width: 640px) {
      .link-login { display: none; }
      h1 { font-size: clamp(24px, 7vw, 46px); line-height: 1.1; }
      #ropeZone { --rope-min-height: clamp(240px, 62vw, 300px); }
      .hero { padding-top: clamp(20px, 5.5vw, 34px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    /* ==============================================================
       0. TUNING CONSTANTS — extracted and documented
    ============================================================== */
    const CFG = {
      camera: { fov: 30, z: 12, parallax: 0.06, damp: 5.0 },

      line: {
        riseFrac: 0.105,
        tiltFrac: 0.0208,
        depthArc: 0.75,
        spread: 0.1,
        radiusPx: 1.8,       // thicker rope → scroll-like
        waveSpeed: 11.0,
        rest: 9.0,
        damp: 3.4,
        nodes: 96,
        samples: 128,
      },

      card: {
        ratio: 1.2,
        spacing: 1.245,
        depth: 0.014,
        corner: 0.062,
        tiltMax: 0.085,
        swingGravity: 22.0,
        swingDamp: 1.75,
        idleAmp: 0.0085,
        lagK: 44,
        lagC: 7.4,
        lagAir: 2.05,
        repelK: 105,
        repelGap: 1.02,
        bounceK: 150,
        bounceC: 9.5,
        weight: 7.0,
      },

      clip: { w: 0.093, h: 0.168, drop: 0.72, depth: 0.05, z: 0.05 },
      input: { momentumDamp: 3.1, wheelGain: 0.9, wheelEase: 9.0 },
    };

    const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const clamp = THREE.MathUtils.clamp;

    /* ==============================================================
       1. CONTENT — 20 portrait styles
    ============================================================== */
    const THEMES = [
      { title: "清新人像",       topic: "clean-lifestyle",      kind: "inkwash"   },
      { title: "纯净曲线",       topic: "pure-desire-curve",    kind: "golddust"  },
      { title: "都市时尚",       topic: "urban-fashion",        kind: "noir"      },
      { title: "古风仙侠",       topic: "gufeng-xianxia",      kind: "mist"      },
      { title: "电商试衣",       topic: "ecommerce-tryon",      kind: "silk"      },
      { title: "港风复古",       topic: "retro-hongkong",       kind: "neon"      },
      { title: "法式慵懒",       topic: "french-lazy",          kind: "cream"     },
      { title: "新中式",         topic: "new-chinese",          kind: "plum"      },
      { title: "运动活力",       topic: "sporty-active",        kind: "speed"     },
      { title: "旅行假日",       topic: "travel-vacation",      kind: "horizon"   },
      { title: "影棚精修",       topic: "studio-retouched",     kind: "studio"    },
      { title: "东方丰腴",       topic: "oriental-voluptuous",  kind: "amber"     },
      { title: "冷调仙侠增强",   topic: "cold-xianxia",         kind: "ice"       },
      { title: "明亮奢华古风",   topic: "bright-luxury",        kind: "brocade"   },
      { title: "超近真实特写",   topic: "ultra-close",          kind: "porcelain" },
      { title: "古韵仕女",       topic: "ancient-lady",         kind: "ink"       },
      { title: "黑珍珠暗金",     topic: "black-pearl",          kind: "onyx"      },
      { title: "柔光CCD活力",   topic: "soft-ccd",             kind: "hazy"      },
      { title: "冷白CCD曲线",   topic: "cold-white-ccd",       kind: "frost"     },
      { title: "低调光影",       topic: "low-key-cinematic",     kind: "shadow"    },
    ];

    // Local portrait images — matched to style index
    const PHOTOS = [
      "assets/01-clean-lifestyle.png",
      "assets/02-pure-desire-curve.png",
      "assets/03-urban-fashion.png",
      "assets/04-gufeng-xianxia.png",
      "assets/05-ecommerce-tryon.png",
      "assets/06-retro-hongkong.png",
      "assets/07-french-lazy.png",
      "assets/08-new-chinese.png",
      "assets/09-sporty-active.png",
      "assets/10-travel-vacation.png",
      "assets/11-studio-retouched.png",
      "assets/12-oriental-voluptuous.png",
      "assets/13-cold-xianxia-enhanced.png",
      "assets/14-bright-luxury-gufeng.png",
      "assets/15-ultra-close-real-face.png",
      "assets/16-ancient-lady-dewy-makeup.png",
      "assets/17-black-pearl-dark-gold-ccd.png",
      "assets/18-soft-ccd-energetic-voluptuous.png",
      "assets/19-cold-white-clear-ccd-curve.png",
      "assets/20-low-key-cinematic.png",
    ];

    document.getElementById("srList").innerHTML = THEMES.map(
      (t) => `<li>${t.title} — ${t.topic}</li>`
    ).join("");

    // Build style bar dots
    const styleBar = document.getElementById("styleBar");
    styleBar.innerHTML = THEMES.map((_, i) =>
      `<span class="style-dot" data-index="${i}"></span>`
    ).join("");

    /* ==============================================================
       2. PROCEDURAL CARD BACKGROUNDS — 8 custom painters
    ============================================================== */
    const TEX_W = 640, TEX_H = Math.round(640 * CFG.card.ratio);
    const rng = (seed) => {
      let s = seed >>> 0;
      return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
    };

    function rrect(c, x, y, w, h, r) {
      r = Math.min(r, w * 0.5, h * 0.5);
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }
    function lg(c, x0, y0, x1, y1, stops) {
      const g = c.createLinearGradient(x0, y0, x1, y1);
      for (const s of stops) g.addColorStop(s[0], s[1]);
      return g;
    }

    const SCENES = {
      // 墨韵 — ink wash painting style
      inkwash(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#F5F0E5"],[0.5,"#E8E0D2"],[1,"#D4C9B8"]]);
        c.fillRect(0, 0, w, h);
        // mountain silhouette
        c.fillStyle = "rgba(90,75,60,0.18)";
        c.beginPath();
        c.moveTo(0, h * 0.75);
        for (let x = 0; x <= w; x += w / 20)
          c.lineTo(x, h * 0.6 + Math.sin(x / w * 4 + 1.2) * h * 0.08);
        c.lineTo(w, h); c.closePath(); c.fill();
        // bamboo
        c.strokeStyle = "rgba(60,90,60,0.35)";
        c.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const bx = w * (0.15 + i * 0.14);
          c.beginPath(); c.moveTo(bx, h); c.lineTo(bx, h * 0.3); c.stroke();
          for (let j = 0; j < 4; j++) {
            const by = h * (0.42 + j * 0.13);
            c.beginPath(); c.moveTo(bx, by); c.lineTo(bx - 18, by - 8); c.stroke();
            c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + 18, by - 8); c.stroke();
          }
        }
        // seal
        c.fillStyle = "rgba(180,60,60,0.5)";
        rrect(c, w * 0.78, h * 0.78, w * 0.12, w * 0.12, 3);
        c.fill();
      },

      // 金砂 — gold dust accent
      golddust(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#1C1812"],[1,"#2E2518"]]);
        c.fillRect(0, 0, w, h);
        c.fillStyle = "#C4963A";
        for (let i = 0; i < 80; i++) {
          c.globalAlpha = 0.08 + r() * 0.25;
          const gx = r() * w, gy = r() * h, gs = 1 + r() * 3;
          c.fillRect(gx, gy, gs, gs);
        }
        c.globalAlpha = 1;
        c.strokeStyle = "rgba(196,150,58,0.3)";
        c.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
          const y = h * (0.2 + i * 0.16);
          c.beginPath();
          c.moveTo(0, y); c.lineTo(w, y + (r() - 0.5) * 10);
          c.stroke();
        }
      },

      // 夜色 — noir
      noir(c, w, h, r) {
        c.fillStyle = "#0A0A0C";
        c.fillRect(0, 0, w, h);
        const cx = w * 0.5, cy = h * 0.5;
        const rg = c.createRadialGradient(cx, cy, 0, cx, cy, h * 0.6);
        rg.addColorStop(0, "rgba(60,55,50,0.6)");
        rg.addColorStop(1, "rgba(0,0,0,0)");
        c.fillStyle = rg;
        c.fillRect(0, 0, w, h);
        c.strokeStyle = "rgba(180,170,160,0.15)";
        c.lineWidth = 1;
        for (let i = 0; i < 12; i++) {
          c.beginPath();
          c.moveTo(r() * w, r() * h);
          c.lineTo(r() * w, r() * h);
          c.stroke();
        }
        // film grain
        const gr = rng(42);
        c.globalAlpha = 0.06;
        for (let i = 0; i < 1200; i++)
          c.fillStyle = gr() > 0.5 ? "#fff" : "#000",
          c.fillRect(gr() * w, gr() * h, 1.5, 1.5);
        c.globalAlpha = 1;
      },

      // 烟岚 — misty mountain
      mist(c, w, h, r) {
        c.fillStyle = lg(c, 0, h * 0.3, 0, h, [[0,"#E8E4DC"],[0.5,"#D0C8BC"],[1,"#B8AFA0"]]);
        c.fillRect(0, 0, w, h);
        // layers
        const cols = ["rgba(160,180,190,0.4)","rgba(180,195,200,0.35)","rgba(200,208,210,0.3)"];
        for (let L = 0; L < 3; L++) {
          c.fillStyle = cols[L];
          c.beginPath();
          c.moveTo(0, h);
          for (let x = 0; x <= w; x += w / 30)
            c.lineTo(x, h * (0.45 + L * 0.12) + Math.sin(x / w * 6 + L) * h * 0.06);
          c.lineTo(w, h); c.closePath(); c.fill();
        }
        // cloud wisps
        c.globalAlpha = 0.25;
        for (let i = 0; i < 6; i++) {
          const cloudGrad = c.createRadialGradient(
            r() * w, h * (0.3 + r() * 0.3), 0,
            r() * w, h * (0.3 + r() * 0.3), h * 0.25
          );
          cloudGrad.addColorStop(0, "rgba(255,255,255,0.8)");
          cloudGrad.addColorStop(1, "rgba(255,255,255,0)");
          c.fillStyle = cloudGrad;
          c.fillRect(0, 0, w, h);
        }
        c.globalAlpha = 1;
      },

      // 丝绸 — silk sheen
      silk(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, w, h, [[0,"#F0E8E0"],[0.5,"#E4D8CC"],[1,"#D4C4B4"]]);
        c.fillRect(0, 0, w, h);
        c.globalAlpha = 0.12;
        for (let i = 0; i < 18; i++) {
          c.strokeStyle = ["#C4963A","#8A6A28","#D4A84B"][i % 3];
          c.lineWidth = 0.8 + r() * 2;
          c.beginPath();
          const y0 = r() * h, y1 = r() * h;
          c.moveTo(0, y0);
          for (let x = 0; x <= w; x += w / 20)
            c.lineTo(x, (y0 + y1) * 0.5 + Math.sin(x / w * 5 + i) * h * 0.05);
          c.stroke();
        }
        c.globalAlpha = 1;
      },

      // 霓虹 — neon HK
      neon(c, w, h, r) {
        c.fillStyle = "#0A0810";
        c.fillRect(0, 0, w, h);
        const neons = ["#FF2D6B","#00E5FF","#FFD700","#AA44FF","#00FF88"];
        for (let i = 0; i < 7; i++) {
          c.globalAlpha = 0.15 + r() * 0.2;
          c.strokeStyle = neons[i % neons.length];
          c.lineWidth = 1 + r() * 3;
          c.beginPath();
          const yBase = h * (0.2 + r() * 0.6);
          c.moveTo(0, yBase + (r() - 0.5) * 20);
          for (let x = 0; x <= w; x += w / 30)
            c.lineTo(x, yBase + Math.sin(x / w * 8 + i) * h * 0.06);
          c.stroke();
        }
        c.globalAlpha = 1;
        c.fillStyle = "rgba(255,220,50,0.06)";
        c.fillRect(0, h * 0.7, w, h * 0.3);
      },

      // 奶油 — cream
      cream(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#FBF8F4"],[0.5,"#F5F0E8"],[1,"#EDE6DC"]]);
        c.fillRect(0, 0, w, h);
        c.globalAlpha = 0.15;
        for (let i = 0; i < 9; i++) {
          c.fillStyle = ["#E8C4A0","#D4B088","#C89870"][i % 3];
          c.beginPath();
          c.ellipse(w * (0.1 + r() * 0.8), h * (0.1 + r() * 0.8), w * (0.05 + r() * 0.1), w * (0.04 + r() * 0.08), r() * 3, 0, 7);
          c.fill();
        }
        c.globalAlpha = 1;
        c.strokeStyle = "rgba(160,130,100,0.12)";
        c.lineWidth = 1;
        for (let i = 0; i < 4; i++)
          c.strokeRect(r() * w * 0.5, r() * h * 0.5, w * (0.2 + r() * 0.3), h * (0.15 + r() * 0.2));
      },

      // 梅韵 — plum blossom
      plum(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#F8F0EC"],[0.6,"#ECD8D4"],[1,"#D4B8B0"]]);
        c.fillRect(0, 0, w, h);
        c.fillStyle = "rgba(180,60,80,0.15)";
        c.fillRect(0, 0, w, h * 0.55);
        // branches
        c.strokeStyle = "rgba(80,40,50,0.4)";
        c.lineWidth = 3;
        c.beginPath(); c.moveTo(w * 0.5, h); c.lineTo(w * 0.4, h * 0.4); c.stroke();
        c.beginPath(); c.moveTo(w * 0.4, h * 0.5); c.lineTo(w * 0.7, h * 0.35); c.stroke();
        c.lineWidth = 2;
        c.beginPath(); c.moveTo(w * 0.5, h); c.lineTo(w * 0.55, h * 0.5); c.stroke();
        // blossoms
        c.fillStyle = "rgba(200,100,110,0.7)";
        for (let i = 0; i < 8; i++) {
          const bx = w * (0.2 + r() * 0.6), by = h * (0.2 + r() * 0.4);
          c.beginPath();
          for (let p = 0; p < 5; p++) {
            const angle = (p / 5) * Math.PI * 2;
            const px = bx + Math.cos(angle) * w * 0.025, py = by + Math.sin(angle) * w * 0.025;
            p === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
          }
          c.closePath(); c.fill();
        }
      },

      // 速度 — speed
      speed(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, w, h, [[0,"#1A1C2C"],[1,"#0E0F18"]]);
        c.fillRect(0, 0, w, h);
        for (let i = 0; i < 14; i++) {
          const y = (i / 14) * h;
          c.globalAlpha = 0.2 + (i / 14) * 0.5;
          c.strokeStyle = i % 2 === 0 ? "#00E5FF" : "#FFFFFF";
          c.lineWidth = 0.5 + r() * 2;
          c.beginPath();
          c.moveTo(0, y); c.lineTo(w, y + (r() - 0.5) * h * 0.08);
          c.stroke();
        }
        c.globalAlpha = 1;
        c.fillStyle = "rgba(0,220,255,0.05)";
        c.beginPath(); c.moveTo(0, h * 0.3); c.lineTo(w * 0.7, h * 0.5); c.lineTo(w, h * 0.48); c.lineTo(0, h * 0.55); c.closePath(); c.fill();
      },

      // 地平线 — horizon
      horizon(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#7EAFCA"],[0.45,"#C8D8E0"],[0.5,"#E8D8C0"],[0.55,"#C8A880"],[1,"#8B6040"]]);
        c.fillRect(0, 0, w, h);
        // sun
        const sunG = c.createRadialGradient(w * 0.65, h * 0.38, 0, w * 0.65, h * 0.38, h * 0.15);
        sunG.addColorStop(0, "rgba(255,230,160,0.9)");
        sunG.addColorStop(1, "rgba(255,200,100,0)");
        c.fillStyle = sunG;

      // 影棚 — studio
      studio(c, w, h, r) {
        c.fillStyle = "#ECECEC";
        c.fillRect(0, 0, w, h);
        const sg = c.createRadialGradient(w * 0.5, h * 0.4, 0, w * 0.5, h * 0.4, h * 0.8);
        sg.addColorStop(0, "rgba(255,255,255,0.8)");
        sg.addColorStop(0.5, "rgba(240,238,235,0.3)");
        sg.addColorStop(1, "rgba(200,198,195,0)");

      // 琥珀 — amber
      amber(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#1A1008"],[0.5,"#2E1C0A"],[1,"#0A0804"]]);
        c.fillRect(0, 0, w, h);
        const ag = c.createRadialGradient(w * 0.5, h * 0.45, 0, w * 0.5, h * 0.45, h * 0.6);
        ag.addColorStop(0, "rgba(200,120,40,0.35)");
        ag.addColorStop(0.6, "rgba(160,80,20,0.15)");
        ag.addColorStop(1, "rgba(0,0,0,0)");
        c.fillStyle = ag;
        c.fillRect(0, 0, w, h);
        c.globalAlpha = 0.3;
        c.fillStyle = "#C4963A";
        for (let i = 0; i < 40; i++)
          c.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2);

      },

      // 冰霜 — ice
      ice(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#E0ECf8"],[0.5,"#C0D4E8"],[1,"#90B4D0"]]);
        c.fillRect(0, 0, w, h);
        c.globalAlpha = 0.15;
        for (let i = 0; i < 8; i++) {
          const ig = c.createLinearGradient(0, h * (0.2 + i * 0.1), 0, h * (0.3 + i * 0.1));
          ig.addColorStop(0, "rgba(200,220,255,0.6)");
          ig.addColorStop(1, "rgba(200,220,255,0)");
          c.fillStyle = ig;
          c.fillRect(0, h * (0.2 + i * 0.1), w, h * 0.08);
        }
        c.globalAlpha = 1;
        c.strokeStyle = "rgba(140,180,210,0.3)";
        c.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
          c.beginPath();
          c.moveTo(0, h * 0.6 + i * 20);
          c.bezierCurveTo(w * 0.3, h * 0.5 + i * 20, w * 0.6, h * 0.7 + i * 20, w, h * 0.55 + i * 20);
          c.stroke();
        }
      },

      // 织锦 — brocade
      brocade(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, w, h, [[0,"#4A1020"],[0.5,"#6A1830"],[1,"#3A0818"]]);
        c.fillRect(0, 0, w, h);
        const pat = ["#C4963A","#8B2020","#2A5840","#1A3880"];
        for (let i = 0; i < 20; i++) {
          c.globalAlpha = 0.15 + r() * 0.2;
          c.fillStyle = pat[i % pat.length];
          c.beginPath();
          c.ellipse(r() * w, r() * h, w * (0.04 + r() * 0.08), w * (0.03 + r() * 0.06), r() * 3, 0, 7);
          c.fill();
        }
        c.globalAlpha = 1;
        c.strokeStyle = "rgba(196,150,58,0.25)";
        c.lineWidth = 1.5;
        for (let i = 0; i < 3; i++) {
          c.beginPath();
          c.moveTo(0, h * (0.2 + i * 0.25));
          for (let x = 0; x <= w; x += w / 25)
            c.lineTo(x, h * (0.18 + i * 0.25 + Math.sin(x / w * 8) * h * 0.03));
          c.stroke();
        }
      },

      // 瓷肌 — porcelain
      porcelain(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#FAF8F6"],[0.5,"#F0EDEA"],[1,"#E8E3DE"]]);
        c.fillRect(0, 0, w, h);
        c.globalAlpha = 0.2;
        for (let i = 0; i < 6; i++) {
          const pg = c.createRadialGradient(r() * w, r() * h, 0, r() * w, r() * h, h * 0.2);
          pg.addColorStop(0, "rgba(220,200,190,0.4)");
          pg.addColorStop(1, "rgba(220,200,190,0)");
          c.fillStyle = pg;
          c.fillRect(0, 0, w, h);
        }
        c.globalAlpha = 1;
        c.strokeStyle = "rgba(200,180,170,0.2)";
        c.lineWidth = 1;
        for (let i = 0; i < 4; i++)
          c.strokeRect(w * 0.1 + i * 15, h * 0.15 + i * 12, w * (0.6 - i * 0.05), h * (0.65 - i * 0.05));
      },

      // 墨 — pure ink
      ink(c, w, h, r) {
        c.fillStyle = "#F0EBE3";
        c.fillRect(0, 0, w, h);
        c.fillStyle = "rgba(30,25,20,0.12)";
        c.fillRect(0, 0, w, h);
        c.strokeStyle = "rgba(30,25,20,0.4)";
        c.lineWidth = 2;
        c.beginPath(); c.moveTo(w * 0.5, h); c.lineTo(w * 0.4, h * 0.3); c.stroke();
        c.beginPath(); c.moveTo(w * 0.4, h * 0.5); c.lineTo(w * 0.65, h * 0.25); c.stroke();
        c.lineWidth = 1.2;
        c.beginPath(); c.moveTo(w * 0.5, h); c.lineTo(w * 0.6, h * 0.45); c.stroke();
        c.fillStyle = "rgba(180,40,40,0.5)";
        rrect(c, w * 0.78, h * 0.76, w * 0.11, w * 0.11, 2); c.fill();
      },

      // 墨玉 — onyx
      onyx(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#0C0C0E"],[0.5,"#141418"],[1,"#08080A"]]);
        c.fillRect(0, 0, w, h);
        const og = c.createRadialGradient(w * 0.4, h * 0.4, 0, w * 0.4, h * 0.4, h * 0.7);
        og.addColorStop(0, "rgba(40,35,30,0.5)");
        og.addColorStop(1, "rgba(0,0,0,0)");
        c.fillStyle = og; c.fillRect(0, 0, w, h);
        c.globalAlpha = 0.25;
        c.fillStyle = "#C4963A";
        for (let i = 0; i < 60; i++)
          c.fillRect(r() * w, r() * h, 0.8 + r() * 1.8, 0.8 + r() * 1.8);
        c.globalAlpha = 1;
      },

      // 柔光 — hazy CCD
      hazy(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#F8F0E8"],[0.5,"#ECDED4"],[1,"#DED4C8"]]);
        c.fillRect(0, 0, w, h);
        for (let i = 0; i < 12; i++) {
          c.globalAlpha = 0.08 + r() * 0.12;
          c.fillStyle = ["#D4A080","#C09070","#E8C0A0","#B88060"][i % 4];
          c.beginPath();
          c.arc(w * (0.2 + r() * 0.6), h * (0.2 + r() * 0.6), h * (0.08 + r() * 0.15), 0, 7);
          c.fill();
        }
        c.globalAlpha = 1;
        c.globalAlpha = 0.06;
        c.fillStyle = "#FFE0C0";
        c.fillRect(0, 0, w, h);
        c.globalAlpha = 1;
      },

      // 霜白 — frost
      frost(c, w, h, r) {
        c.fillStyle = lg(c, 0, 0, 0, h, [[0,"#F0F4F8"],[0.5,"#E0E8F0"],[1,"#CED8E4"]]);
        c.fillRect(0, 0, w, h);
        c.globalAlpha = 0.1;
        for (let i = 0; i < 10; i++) {
          c.fillStyle = "#FFFFFF";
          c.beginPath();
          c.arc(r() * w, r() * h, h * (0.05 + r() * 0.1), 0, 7);
          c.fill();
        }
        c.globalAlpha = 1;
        c.strokeStyle = "rgba(160,180,200,0.25)";
        c.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
          c.beginPath();
          c.moveTo(0, h * (0.15 + i * 0.12));
          c.lineTo(w, h * (0.12 + i * 0.12 + (r() - 0.5) * 15));
          c.stroke();
        }
      },

      // 暗影 — shadow / cinematic
      shadow(c, w, h, r) {
        c.fillStyle = "#0A0A0A";
        c.fillRect(0, 0, w, h);
        const sg = c.createRadialGradient(w * 0.35, h * 0.45, 0, w * 0.35, h * 0.45, h * 0.7);
        sg.addColorStop(0, "rgba(40,35,30,0.6)");
        sg.addColorStop(0.4, "rgba(20,18,15,0.3)");
        sg.addColorStop(1, "rgba(0,0,0,0)");
        c.fillStyle = sg; c.fillRect(0, 0, w, h);
        // rim light hint
        c.strokeStyle = "rgba(180,140,80,0.08)";
        c.lineWidth = 2;
        c.beginPath();
        c.ellipse(w * 0.35, h * 0.45, w * 0.3, h * 0.38, -0.2, 0, 7);
        c.stroke();
      },
    };

    function paintPhoto(c, theme, seed, pad, iw, ih) {
      c.save();
      rrect(c, pad, pad, iw, ih, TEX_W * 0.036);
      c.clip();
      c.translate(pad, pad);
      (SCENES[theme.kind] || SCENES.plum)(c, iw, ih, rng(seed * 9301 + 49297));
      c.restore();
    }

    function makeCardCanvas(theme, seed, photo) {
      const cv = document.createElement("canvas");
      cv.width = TEX_W; cv.height = TEX_H;
      const c = cv.getContext("2d");

      c.fillStyle = "#FAF6F0"; // 宣纸色
      c.fillRect(0, 0, TEX_W, TEX_H);

      const pad = Math.round(TEX_W * 0.053);
      const iw = TEX_W - pad * 2,
            ih = Math.round(TEX_W * 0.869);

      if (photo) {
        c.save();
        rrect(c, pad, pad, iw, ih, TEX_W * 0.036);
        c.clip();
        const s = Math.max(iw / photo.width, ih / photo.height);
        c.drawImage(photo, pad + (iw - photo.width * s) / 2, pad + (ih - photo.height * s) / 2, photo.width * s, photo.height * s);
        c.restore();
      } else {
        paintPhoto(c, theme, seed, pad, iw, ih);
      }

      // film grain
      const gr = rng(seed + 77);
      c.globalAlpha = 0.035;
      for (let i = 0; i < 2400; i++) {
        c.fillStyle = gr() > 0.5 ? "#fff" : "#000";
        c.fillRect(pad + gr() * iw, pad + gr() * ih, 1.2, 1.2);
      }
      c.globalAlpha = 1;

      rrect(c, pad, pad, iw, ih, TEX_W * 0.036);
      c.strokeStyle = "rgba(160,140,100,0.15)";
      c.lineWidth = 1.5;
      c.stroke();

      // 金色内边线
      rrect(c, pad + 3, pad + 3, iw - 6, ih - 6, TEX_W * 0.034);
      c.strokeStyle = "rgba(196,150,58,0.2)";
      c.lineWidth = 1;
      c.stroke();

      // 文字
      const ff = '"Noto Serif SC","Noto Serif",serif';
      c.textBaseline = "alphabetic";
      c.fillStyle = "#1A1612";
      c.font = `600 ${Math.round(TEX_W * 0.048)}px ${ff}`;
      c.fillText(theme.title, pad + 2, pad + ih + Math.round(TEX_W * 0.094));
      c.fillStyle = "#8A7A6A";
      c.font = `400 ${Math.round(TEX_W * 0.031)}px ${ff}`;
      c.fillText(theme.topic, pad + 2, pad + ih + Math.round(TEX_W * 0.138));

      return cv;
    }

    function makeShadowTexture() {
      const S = 256, cv = document.createElement("canvas");
      cv.width = S; cv.height = Math.round(S * CFG.card.ratio);
      const c = cv.getContext("2d");
      c.shadowColor = "rgba(0,0,0,1)";
      c.shadowBlur = S * 0.17;
      c.shadowOffsetY = S * 0.02;
      c.fillStyle = "#000";
      rrect(c, S * 0.15, cv.height * 0.12, S * 0.7, cv.height * 0.74, S * 0.06);
      c.fill();
      const t = new THREE.CanvasTexture(cv);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    /* ==============================================================
       3. GEOMETRY LIBRARY
    ============================================================== */
    function roundedPlane(w, h, r, seg = 8) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      r = Math.min(r, w / 2, h / 2);
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      const g = new THREE.ShapeGeometry(s, seg);
      const p = g.attributes.position, uv = g.attributes.uv;
      for (let i = 0; i < p.count; i++)
        uv.setXY(i, p.getX(i) / w + 0.5, p.getY(i) / h + 0.5);
      uv.needsUpdate = true;
      return g;
    }

    function clipGeometry(w, h, d) {
      const s = new THREE.Shape();
      const r = w * 0.44, x = -w / 2, y = -h * 0.8;
      s.moveTo(x + r, y); s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      const g = new THREE.ExtrudeGeometry(s, {
        depth: d * 0.7, bevelEnabled: true,
        bevelThickness: d * 0.15, bevelSize: d * 0.15, bevelSegments: 3, curveSegments: 10,
      });
      g.translate(0, 0, -d * 0.5);
      g.computeVertexNormals();
      return g;
    }

    /* ==============================================================
       4. ROPE MATERIAL — dark wood / ink scroll shader
    ============================================================== */
    const ropeMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uColorA: { value: new THREE.Color("#2E2518") }, // dark wood
        uColorB: { value: new THREE.Color("#1A1208") }, // deep shadow
        uLight:  { value: new THREE.Vector3(-0.45, 0.68, 0.58).normalize() },
      },
      vertexShader: `
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      vUv = uv;
      vN = normalize(mat3(modelMatrix) * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vV = normalize(cameraPosition - wp.xyz);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
      fragmentShader: `
    uniform vec3 uColorA, uColorB, uLight;
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      float tw = fract(vUv.y * 210.0 + vUv.x * 3.0);
      float strand = smoothstep(0.0, 0.34, tw) * (1.0 - smoothstep(0.66, 1.0, tw));
      float fibre = fract(sin(vUv.y * 4100.0) * 43758.5453);
      float diff = max(dot(vN, uLight), 0.0);
      float rim  = pow(1.0 - abs(dot(vN, vV)), 2.2);
      vec3 col = mix(uColorB, uColorA, strand * 0.8 + 0.2);
      col *= 0.65 + diff * 0.4 + fibre * 0.04;
      col += rim * 0.12;
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
    });

    /* ==============================================================
       5. RENDERER / SCENE / CAMERA / LIGHTS
    ============================================================== */
    const canvas = document.getElementById("stage");
    const renderer = new THREE.WebGLRenderer({
      canvas, antialias: true, alpha: true, powerPreference: "high-performance",
    });
    renderer.setClearAlpha(0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(CFG.camera.fov, 1, 0.1, 60);
    camera.position.set(0, 0, CFG.camera.z);

    {
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.26;
      pmrem.dispose();
    }
    scene.add(new THREE.HemisphereLight(0xfff8f0, 0xede6d8, 0.5));
    const key = new THREE.DirectionalLight(0xfff4e4, 0.42);
    key.position.set(-3, 4, 6);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xfff4e4, 0.15);
    fill.position.set(4, -1.5, 3);
    scene.add(fill);

    const world = new THREE.Group();
    scene.add(world);

    /* ==============================================================
       6. LAYOUT MANAGER
    ============================================================== */
    const ropeZone = document.getElementById("ropeZone");
    const L = {};

    function layout() {
      const W = canvas.clientWidth;
      L.halfWpx = W * 0.5;
      L.cardWpx = W < 640 ? W * 0.435 : W < 1024 ? W * 0.245 : Math.min(W * 0.179, 236);
      L.cardHpx = L.cardWpx * CFG.card.ratio;
      L.spacingPx = L.cardWpx * CFG.card.spacing;
      L.slots = Math.max(5, Math.ceil((2.75 * L.halfWpx) / L.spacingPx));
      L.halfSpanPx = L.slots * L.spacingPx * 0.5;

      const tEdge = Math.min(0.92, L.halfWpx / L.halfSpanPx);
      L.sagPx = (CFG.line.riseFrac * L.halfWpx) / (1 - tEdge * tEdge);
      L.tiltPx = (CFG.line.tiltFrac * W) / (2 * tEdge);

      const topRisePx = L.sagPx * tEdge * tEdge + Math.abs(L.tiltPx * tEdge);
      const clipDropPx = L.cardWpx * CFG.clip.h * CFG.clip.drop;
      const renderOverhangPx = Math.ceil(topRisePx + 18);
      const renderDepthPx = Math.ceil(clipDropPx + L.cardHpx * 1.1 + 28);
      ropeZone.style.setProperty("--rope-overhang", `${renderOverhangPx}px`);
      ropeZone.style.setProperty("--rope-min-height", `${renderDepthPx}px`);

      const H = canvas.clientHeight;
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      renderer.setSize(W, H, false);

      L.worldH = 2 * CFG.camera.z * Math.tan(THREE.MathUtils.degToRad(CFG.camera.fov) * 0.5);
      L.ppu = H / L.worldH;
      L.viewH = H;

      L.anchorPx = ropeZone.getBoundingClientRect().top - canvas.getBoundingClientRect().top;

      L.cardW = L.cardWpx / L.ppu;
      L.cardH = L.cardHpx / L.ppu;
      L.spacing = L.spacingPx / L.ppu;
      L.halfSpan = L.halfSpanPx / L.ppu;
      L.span = L.halfSpan * 2;
      L.clipW = L.cardW * CFG.clip.w;
      L.clipH = L.cardW * CFG.clip.h;
      L.clipDrop = L.clipH * CFG.clip.drop;
      L.ropeR = CFG.line.radiusPx / L.ppu;

      const dx = L.span / (CFG.line.nodes - 1);
      L.tension = (CFG.line.waveSpeed / dx) ** 2;
      L.maxDisp = L.cardH * 0.25;
    }

    const pxToWorldY = (px) => (L.viewH * 0.5 - px) / L.ppu;

    /* ==============================================================
       7. ROPE PHYSICS — 1D wave chain
    ============================================================== */
    const N = CFG.line.nodes;
    const rope = {
      dy: new Float32Array(N), vy: new Float32Array(N), ly: new Float32Array(N),
      dz: new Float32Array(N), vz: new Float32Array(N), lz: new Float32Array(N),
    };

    function sampleWave(arr, t) {
      const f = (t + 1) * 0.5 * (N - 1);
      const i = clamp(f | 0, 0, N - 2);
      const a = f - i;
      return arr[i] * (1 - a) + arr[i + 1] * a;
    }
    function addLoad(arr, t, v) {
      const f = (t + 1) * 0.5 * (N - 1);
      const i = clamp(f | 0, 0, N - 2);
      const a = f - i;
      arr[i] += v * (1 - a);
      arr[i + 1] += v * a;
    }

    function stepRope(dt) {
      const T = L.tension, { rest, damp } = CFG.line;
      const sub = clamp(Math.ceil(dt * Math.sqrt(2 * T)), 2, 6);
      const h = dt / sub, lim = L.maxDisp;
      for (let s = 0; s < sub; s++) {
        for (let i = 1; i < N - 1; i++) {
          rope.vy[i] += (T * (rope.dy[i-1] + rope.dy[i+1] - 2 * rope.dy[i]) - rest * rope.dy[i] - damp * rope.vy[i] + rope.ly[i]) * h;
          rope.vz[i] += (T * (rope.dz[i-1] + rope.dz[i+1] - 2 * rope.dz[i]) - rest * rope.dz[i] - damp * rope.vz[i] + rope.lz[i]) * h;
        }
        for (let i = 1; i < N - 1; i++) {
          rope.dy[i] = clamp(rope.dy[i] + rope.vy[i] * h, -lim, lim);
          rope.dz[i] = clamp(rope.dz[i] + rope.vz[i] * h, -lim, lim);
        }
      }
      rope.dy[0] = rope.dy[N-1] = rope.dz[0] = rope.dz[N-1] = 0;
    }

    const _ap = { x: 0, y: 0, z: 0 };
    function lineApparent(t) {
      const sp = CFG.line.spread;
      _ap.x = (L.halfSpan * (t + sp * t * t * t)) / (1 + sp);
      _ap.y = pxToWorldY(L.anchorPx - L.sagPx * t * t + L.tiltPx * t) + sampleWave(rope.dy, t);
      _ap.z = CFG.line.depthArc * t * t + sampleWave(rope.dz, t);
      return _ap;
    }
    function lineWorld(t, v) {
      lineApparent(t);
      const k = (CFG.camera.z - _ap.z) / CFG.camera.z;
      return v.set(_ap.x * k, _ap.y * k, _ap.z);
    }

    // Build tube geometry
    const M = CFG.line.samples, R = 6;
    const ropeGeo = new THREE.BufferGeometry();
    {
      const pos = new Float32Array(M * R * 3), nor = new Float32Array(M * R * 3), uv = new Float32Array(M * R * 2);
      const idx = [];
      for (let i = 0; i < M; i++)
        for (let j = 0; j < R; j++) {
          uv[(i * R + j) * 2] = j / R;
          uv[(i * R + j) * 2 + 1] = i / (M - 1);
        }
      for (let i = 0; i < M - 1; i++)
        for (let j = 0; j < R; j++) {
          const a = i * R + j, b = i * R + ((j + 1) % R), c = (i + 1) * R + j, d = (i + 1) * R + ((j + 1) % R);
          idx.push(a, c, b, b, c, d);
        }
      ropeGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      ropeGeo.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
      ropeGeo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      ropeGeo.setIndex(idx);
    }
    const ropeMesh = new THREE.Mesh(ropeGeo, ropeMaterial);
    ropeMesh.frustumCulled = false;
    world.add(ropeMesh);

    const _p0 = new THREE.Vector3(), _pA = new THREE.Vector3(), _pB = new THREE.Vector3();
    const _tan = new THREE.Vector3(), _nrm = new THREE.Vector3(), _bin = new THREE.Vector3();
    const _up = new THREE.Vector3(0, 0, 1);

    function updateRopeMesh() {
      const pos = ropeGeo.attributes.position.array, nor = ropeGeo.attributes.normal.array;
      const step = 2 / (M - 1);
      for (let i = 0; i < M; i++) {
        const t = -1 + step * i;
        lineWorld(t, _p0);
        lineWorld(Math.max(-1, t - step), _pA);
        lineWorld(Math.min(1, t + step), _pB);
        _tan.subVectors(_pB, _pA).normalize();
        _nrm.crossVectors(_tan, _up);
        if (_nrm.lengthSq() < 1e-9) _nrm.set(0, 1, 0);
        _nrm.normalize();
        _bin.crossVectors(_tan, _nrm).normalize();
        for (let j = 0; j < R; j++) {
          const a = (j / R) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
          const nx = _nrm.x * ca + _bin.x * sa, ny = _nrm.y * ca + _bin.y * sa, nz = _nrm.z * ca + _bin.z * sa;
          const o = (i * R + j) * 3;
          pos[o] = _p0.x + nx * L.ropeR; pos[o+1] = _p0.y + ny * L.ropeR; pos[o+2] = _p0.z + nz * L.ropeR;
          nor[o] = nx; nor[o+1] = ny; nor[o+2] = nz;
        }
      }
      ropeGeo.attributes.position.needsUpdate = true;
      ropeGeo.attributes.normal.needsUpdate = true;
    }

    /* ==============================================================
       8. HANGING CARDS
    ============================================================== */
    const shadowTex = makeShadowTexture();

    // 装裱卡夹 — dark wood with gold rim
    const clipBodyMat = new THREE.MeshPhysicalMaterial({
      color: "#1A1208", roughness: 0.45, metalness: 0.05,
      clearcoat: 0.3, clearcoatRoughness: 0.3, envMapIntensity: 0.7,
    });
    const clipDotMat = new THREE.MeshPhysicalMaterial({
      color: "#C4963A", roughness: 0.35, metalness: 0.4,
      clearcoat: 0.8,
    });

    const cards = [];
    let textures = [];
    let sharedClipGeo = null, sharedDotGeo = null;

    function buildTextures(photos) {
      textures.forEach(t => t.dispose());
      textures = THEMES.map((th, i) => {
        const t = new THREE.CanvasTexture(makeCardCanvas(th, i + 1));
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        t.minFilter = THREE.LinearMipmapLinearFilter;
        return t;
      });
      // Load photos into matching textures
      photos.forEach((url, i) => {
        if (!THEMES[i]) return;
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          textures[i].image = makeCardCanvas(THEMES[i], i + 1, img);
          textures[i].needsUpdate = true;
        };
        img.src = url;
      });
    }

    function buildCards() {
      for (const c of cards) {
        world.remove(c.pivot);
        c.cardGeo.dispose(); c.shadowGeo.dispose(); c.mat.dispose();
        c.shadow.material.dispose();
      }
      cards.length = 0;
      if (sharedClipGeo) sharedClipGeo.dispose();
      if (sharedDotGeo) sharedDotGeo.dispose();
      sharedClipGeo = clipGeometry(L.clipW, L.clipH, CFG.clip.depth);
      sharedDotGeo = new THREE.CircleGeometry(L.clipW * 0.2, 18);

      const drop = L.clipDrop + L.cardH * 0.5;

      for (let i = 0; i < L.slots; i++) {
        const pivot = new THREE.Group();

        const cardGeo = roundedPlane(L.cardW, L.cardH, L.cardW * CFG.card.corner);
        const mat = new THREE.MeshPhysicalMaterial({
          map: textures[i % textures.length],
          roughness: 0.62, metalness: 0, clearcoat: 0.22,
          clearcoatRoughness: 0.55, envMapIntensity: 0.4, side: THREE.DoubleSide,
        });
        const mesh = new THREE.Mesh(cardGeo, mat);
        mesh.position.set(0, -drop, CFG.card.depth);

        const shadowGeo = roundedPlane(L.cardW * 1.17, L.cardH * 1.15, L.cardW * 0.1, 6);
        const shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({
          map: shadowTex, transparent: true, opacity: 0.18, depthWrite: false, color: 0x1a1208,
        }));
        shadow.position.set(0, -drop - L.cardH * 0.012, CFG.card.depth - 0.006);

        const clip = new THREE.Mesh(sharedClipGeo, clipBodyMat);
        clip.position.z = CFG.clip.z;
        const dot = new THREE.Mesh(sharedDotGeo, clipDotMat);
        dot.position.set(0, -L.clipH * 0.04, CFG.clip.z + 0.028);

        pivot.add(shadow, mesh, clip, dot);
        world.add(pivot);

        cards.push({
          pivot, mesh, shadow, mat, cardGeo, shadowGeo, drop, slot: i,
          lag: 0, lagV: 0, theta: 0, thetaV: 0, tilt: 0, tiltV: 0,
          bounce: 0, bounceV: 0, prevX: null, vx: 0, ax: 0, speed: 0, prevSpeed: 0,
          mass: 0.9 + ((i * 0.137) % 1) * 0.3,
          baseRot: (((i * 0.618) % 1) - 0.5) * 0.075,
          phase: i * 1.7, along: 0, texIndex: -1,
        });
      }
    }

    /* ==============================================================
       9. INPUT MANAGER
    ============================================================== */
    const hit = document.getElementById("ropeHit");
    const io = {
      offset: 0, vel: 0, accel: 0, prevVel: 0, wheel: 0, kb: 0,
      dragging: false, lastX: 0, lastT: 0,
    };
    const ptr = { x: 0, y: 0, tx: 0, ty: 0 };

    const hintEl = document.getElementById("hint");
    let hintTimer = setTimeout(() => hintEl.classList.add("show"), 1800);
    function hideHint() { clearTimeout(hintTimer); hintEl.classList.remove("show"); }

    hit.addEventListener("pointerdown", (e) => {
      io.dragging = true; io.lastX = e.clientX; io.lastT = performance.now(); io.vel = 0;
      hit.classList.add("dragging");
      try { hit.setPointerCapture(e.pointerId); } catch {}
      hideHint();
    });
    hit.addEventListener("pointermove", (e) => {
      if (!io.dragging) return;
      const now = performance.now();
      const dt = Math.max(8, now - io.lastT) / 1000;
      const dx = (e.clientX - io.lastX) / L.ppu;
      io.offset += dx;
      io.vel = io.vel * 0.55 + (dx / dt) * 0.45;
      io.lastX = e.clientX; io.lastT = now;
    });
    const endDrag = () => {
      if (!io.dragging) return;
      io.dragging = false; hit.classList.remove("dragging");
      if (REDUCED) io.vel *= 0.25;
    };
    hit.addEventListener("pointerup", endDrag);
    hit.addEventListener("pointercancel", endDrag);
    hit.addEventListener("lostpointercapture", endDrag);

    hit.addEventListener("wheel", (e) => {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (!d) return;
      e.preventDefault();
      io.wheel += (-d / L.ppu) * CFG.input.wheelGain;
      hideHint();
    }, { passive: false });

    hit.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault();
      const dir = e.key === "ArrowLeft" ? -1 : 1;
      gsap.to(io, {
        kb: io.kb + dir * L.spacing,
        duration: REDUCED ? 0.2 : 0.9,
        ease: "power3.out", overwrite: true,
      });
      hideHint();
    });

    addEventListener("pointermove", (e) => {
      ptr.tx = (e.clientX / innerWidth) * 2 - 1;
      ptr.ty = (e.clientY / innerHeight) * 2 - 1;
    });

    /* ==============================================================
       10. FRAME LOOP
    ============================================================== */
    const _v = new THREE.Vector3();
    const order = [];
    let time = 0, prevKb = 0;
    const styleCountEl = document.getElementById("styleCount");
    const dots = document.querySelectorAll(".style-dot");

    const wrapAlong = (a) => a - Math.floor((a + L.halfSpan) / L.span) * L.span;

    function tick() {
      const dt = Math.min(1 / 30, gsap.ticker.deltaRatio(60) / 60);
      time += dt;

      const wStep = io.wheel * Math.min(1, dt * CFG.input.wheelEase);
      io.wheel -= wStep;
      const kbStep = io.kb - prevKb;
      prevKb = io.kb;
      io.offset += wStep + kbStep;

      if (!io.dragging) {
        io.offset += io.vel * dt;
        io.vel *= Math.exp(-(REDUCED ? 9 : CFG.input.momentumDamp) * dt);
      }
      const injected = wStep + kbStep;
      if (Math.abs(injected) > 1e-6) io.vel = (injected / dt) * 0.6 + io.vel * 0.4;

      io.accel = io.accel * 0.7 + ((io.vel - io.prevVel) / dt) * 0.3;
      io.prevVel = io.vel;

      const C = CFG.card;
      for (const c of cards) {
        const a = (-C.lagK * c.lag - C.lagC * c.lagV - C.lagAir * io.vel) / c.mass - io.accel * 0.32;
        c.lagV += a * dt;
        c.lag = clamp(c.lag + c.lagV * dt, -L.spacing * 0.7, L.spacing * 0.7);
        c.along = wrapAlong(c.slot * L.spacing + io.offset + c.lag);
      }

      order.length = 0;
      for (let i = 0; i < cards.length; i++) order.push(i);
      order.sort((a, b) => cards[a].along - cards[b].along);

      const minGap = L.cardW * C.repelGap;
      for (let n = 0; n < order.length; n++) {
        const A = cards[order[n]], B = cards[order[(n + 1) % order.length]];
        let gap = B.along - A.along;
        if (gap < 0) gap += L.span;
        if (gap < minGap) {
          const f = (minGap - gap) * C.repelK * dt;
          A.lagV -= f / A.mass; B.lagV += f / B.mass;
        }
      }

      rope.ly.fill(0); rope.lz.fill(0);
      const ga = clamp(io.accel, -50, 50), gv = clamp(io.vel, -10, 10);
      for (const c of cards) {
        const t = c.along / L.halfSpan;
        addLoad(rope.ly, t, -C.weight * c.mass - ga * 0.05 * c.mass);
        addLoad(rope.lz, t, -gv * 0.6);
      }
      let mean = 0;
      for (let i = 0; i < N; i++) mean += rope.ly[i];
      mean /= N;
      for (let i = 0; i < N; i++) rope.ly[i] -= mean;
      stepRope(dt);

      // Update style counter — find the center-most card
      let centerCard = null, minDist = Infinity;
      for (const c of cards) {
        const dist = Math.abs(c.along);
        if (dist < minDist) { minDist = dist; centerCard = c; }
      }
      if (centerCard) {
        const wraps = Math.floor((centerCard.slot * L.spacing + io.offset + centerCard.lag + L.halfSpan) / L.span);
        const nt = THEMES.length;
        const ti = (((centerCard.slot - wraps * L.slots) % nt) + nt * 1000) % nt;
        styleCountEl.textContent = `${ti + 1} / ${nt}`;

        dots.forEach((d, i) => d.classList.toggle("active", i === ti));
      }

      for (const c of cards) {
        const t = clamp(c.along / L.halfSpan, -1, 1);
        lineWorld(t, _v);
        c.pivot.position.copy(_v);

        if (c.prevX === null) c.prevX = _v.x;
        const vx = (_v.x - c.prevX) / dt;
        c.ax = c.ax * 0.65 + ((vx - c.vx) / dt) * 0.35;
        c.vx = c.vx * 0.4 + vx * 0.6;
        c.prevX = _v.x;

        let thA = -(C.swingGravity / c.drop) * Math.sin(c.theta) - (c.ax / c.drop) * Math.cos(c.theta) - C.swingDamp * c.thetaV;
        if (!REDUCED) {
          thA += Math.sin(time * 0.63 + c.phase) * C.idleAmp + Math.sin(time * 1.41 + c.phase * 2.3) * C.idleAmp * 0.45;
        }
        c.thetaV += (thA * dt) / c.mass;
        c.theta = clamp(c.theta + c.thetaV * dt, -0.7, 0.7);

        c.speed = Math.abs(c.vx);
        const tiltTarget = -Math.min(C.tiltMax, c.speed * 0.03);
        c.tiltV += ((tiltTarget - c.tilt) * 190 - c.tiltV * 17) * dt;
        c.tilt += c.tiltV * dt;

        c.bounceV += (c.prevSpeed - c.speed) * 0.014;
        c.bounceV += (-C.bounceK * c.bounce - C.bounceC * c.bounceV) * dt;
        c.bounce = clamp(c.bounce + c.bounceV * dt, -L.cardH * 0.02, L.cardH * 0.02);
        c.prevSpeed = c.speed;

        c.pivot.rotation.z = c.baseRot + c.theta;
        c.pivot.rotation.x = c.tilt;
        c.mesh.position.y = -c.drop + c.bounce;

        c.shadow.position.x = -c.theta * L.cardH * 0.22;
        c.shadow.position.y = c.mesh.position.y - L.cardH * 0.012 - Math.abs(c.theta) * L.cardH * 0.02;
        c.shadow.material.opacity = 0.18 - Math.min(0.08, c.speed * 0.012);

        const wraps = Math.floor((c.slot * L.spacing + io.offset + c.lag + L.halfSpan) / L.span);
        const nt = textures.length;
        const ti = (((c.slot - wraps * L.slots) % nt) + nt * 1000) % nt;
        if (ti !== c.texIndex) {
          c.texIndex = ti;
          c.mat.map = textures[ti];
          c.mat.needsUpdate = true;
        }
      }

      updateRopeMesh();

      if (!REDUCED) {
        const k = 1 - Math.exp(-CFG.camera.damp * dt);
        ptr.x += (ptr.tx - ptr.x) * k;
        ptr.y += (ptr.ty - ptr.y) * k;
        camera.position.x = ptr.x * CFG.camera.parallax * 4;
        camera.position.y = -ptr.y * CFG.camera.parallax * 2;
        camera.lookAt(camera.position.x * 0.55, camera.position.y * 0.55, 0);
      }

      renderer.render(scene, camera);
      meter(dt);
    }

    /* ==============================================================
       11. PERFORMANCE MONITOR
    ============================================================== */
    const fpsEl = document.getElementById("fps");
    let showFps = false, frames = 0, acc = 0, lowered = 0;
    let dpr = Math.min(2, devicePixelRatio || 1);
    renderer.setPixelRatio(dpr);

    function meter(dt) {
      frames++; acc += dt;
      if (acc < 0.5) return;
      const fps = frames / acc; frames = 0; acc = 0;
      if (showFps) fpsEl.textContent = `${fps.toFixed(0)} fps · ${cards.length} cards · dpr ${dpr.toFixed(2)}`;
      if (fps < 46 && lowered < 2) { lowered++; dpr = Math.max(1, dpr - 0.35); renderer.setPixelRatio(dpr); }
    }
    addEventListener("keydown", (e) => {
      if (e.key === "p" || e.key === "P") { showFps = !showFps; fpsEl.style.display = showFps ? "block" : "none"; }
    });

    /* ==============================================================
       12. BOOT
    ============================================================== */
    let resizeRaf = 0;
    addEventListener("resize", () => {
      cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(() => { layout(); buildCards(); });
    });

    (async () => {
      try { await document.fonts.ready; } catch {}
      layout();
      buildTextures(PHOTOS);
      buildCards();

      gsap.ticker.lagSmoothing(500, 33);
      gsap.ticker.add(tick);

      if (!REDUCED) {
        gsap.from(cards.map(c => c.pivot.scale), {
          x: 0.86, y: 0.86, z: 0.86,
          duration: 1.1, ease: "elastic.out(1, 0.62)",
          stagger: { each: 0.05, from: "center" },
        });
        gsap.fromTo(io, { vel: 2.2 }, { vel: 0, duration: 2.2, ease: "power2.out" });
      }
    })();
  </script>
</body>
</html>
